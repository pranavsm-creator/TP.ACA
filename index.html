      <h3>Understanding Transfer Pricing (TP)</h3>
      <p>Transfer pricing refers to the terms and conditions (including prices) governing commercial transactions between <b>Associated Enterprises (AEs)</b> under common control (e.g., a parent company in the US selling IP rights or services to a subsidiary in India).</p>
      <p>Tax authorities monitor TP because related entities could artificially shift profits to low-tax jurisdictions by overcharging or undercharging for goods, services, loans, or intangibles.</p>
      
      <h3>The Arm's Length Principle (ALP)</h3>
      <p>The standard internationally agreed upon for setting transfer prices is the <b>Arm's Length Principle</b> (OECD TP Guidelines Art. 9, US IRC §482, India Sec. 92C).</p>
      <div class="formula-box">
        Arm's Length Price = Price that would be charged between two completely independent/unrelated entities for a comparable transaction under comparable circumstances.
      </div>
      <p><b>Key Rule:</b> Commercial & financial relations between related parties must mimic free-market conditions.</p>

  {

    content: `
      <h3>Selection of the Most Appropriate Method (MAM)</h3>
      <p>OECD & domestic tax laws outline 5 standard methods to determine the Arm's Length Price:</p>

      <h3>1. Traditional Transaction Methods</h3>
      <ul>
        <li><b>Comparable Uncontrolled Price (CUP):</b> Compares price charged in a controlled transaction directly to price in an uncontrolled transaction. (Best for commodities, interest rates).</li>
        <li><b>Resale Price Method (RPM):</b> $Gross\\ Margin = (Resale\\ Price - Purchase\\ Price) / Resale\\ Price$. (Best for distributors).</li>
        <li><b>Cost Plus Method (CPM):</b> $Gross\\ Markup = (Selling\\ Price - Direct/Indirect\\ Cost) / Direct\\ Cost$. (Best for contract manufacturing).</li>

        <li><b>Transactional Net Margin Method (TNMM):</b> Examines net profit relative to an appropriate base (costs, sales, assets). Most commonly used globally for routine service providers.</li>
        <div class="formula-box">Profit Level Indicator (PLI) = Operating Profit / Operating Expenses (OP/OPEX)</div>

      <h3>Intangible Property in Transfer Pricing</h3>
      <p>Legal ownership of a patent or trademark alone does <b>NOT</b> automatically entitle an entity to all economic returns. OECD BEPS Action 8–10 introduced the <b>DEMPE Framework</b>.</p>

      <h3>Advance Pricing Agreements (APAs)</h3>
      <p>An agreement between a taxpayer and tax authorities setting the transfer pricing methodology and arm's length prices for future years (typically 5 forward years + up to 4 rollback years).</p>
      <ul>
        <li><b>Unilateral APA:</b> Taxpayer & domestic tax authority.</li>

      <h3>Mutual Agreement Procedure (MAP)</h3>

// --- RENDER ENGINE ---
function renderNav() {
  const tabs = [
    ["home", "🏠 Home"],
    ["learn", "📚 Learning Modules"],
    ["ai-studio", "🤖 AI Tutor & Doubts"],
    ["calculator", "🧮 PLI Calculator"],
    ["countries", "🌐 Global Rules"],
    ["career", "💼 Job Prep & Interviews"]
  ];
  
  const navEl = document.getElementById("nav-bar");
  navEl.innerHTML = tabs.map(t => 
    `<button class="${STATE.tab === t[0] ? 'active' : ''}" onclick="switchTab('${t[0]}')">${t[1]}</button>`
  ).join("");
}

function switchTab(t) {
  STATE.tab = t;
  STATE.currentLesson = null;
  render();
}

function render() {
  renderNav();
  const main = document.getElementById("main-app");
  
  switch(STATE.tab) {
    case "home": renderHome(main); break;
    case "learn": renderLearn(main); break;
    case "ai-studio": renderAIStudio(main); break;
    case "calculator": renderCalculator(main); break;
    case "countries": renderCountries(main); break;
    case "career": renderCareer(main); break;
  }
}

function sendAIPrompt() {
  const input = document.getElementById("ai-input");
  const text = input.value.trim();
  if(!text) return;
  runPresetPrompt(text);
  input.value = "";
}

function runPresetPrompt(promptText) {
  const chatBox = document.getElementById("ai-chat-box");
  if(!chatBox) return;

  chatBox.innerHTML += `<div class="msg msg-user">${escapeHtml(promptText)}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;

  // Generate simulated AI response based on transfer pricing technical rules
  setTimeout(() => {
    let reply = generateTPResponse(promptText);
    chatBox.innerHTML += `<div class="msg msg-ai">${reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }, 500);
}

function generateTPResponse(q) {
  const query = q.toLowerCase();
  
  if (query.includes("software") || query.includes("r&d") || query.includes("captive")) {
    return `<b>Analysis for Software R&D / Captive Service Provider:</b><br><br>
    <b>1. Most Appropriate Method (MAM):</b> Transactional Net Margin Method (TNMM).<br>
    <b>2. Tested Party:</b> The local captive subsidiary (least complex, routine functions).<br>
    <b>3. Profit Level Indicator (PLI):</b> Operating Profit / Operating Cost (OP/OC).<br>
    <b>4. Key Benchmark Range:</b> Typically 12% to 18% mark-up on cost depending on database search filters and location (e.g., India/EE/LATAM).<br>
    <b>5. Statutory Citation:</b> OECD Chapter II; India Rule 10B(1)(e).`;
  } else if (query.includes("lrd") || query.includes("distributor") || query.includes("far")) {
    return `<b>FAR Analysis for Limited Risk Distributor (LRD):</b><br><br>
    • <b>Functions:</b> Buys finished goods from parent, sells to local market. Does NOT create marketing intangibles.<br>
    • <b>Assets:</b> Routine office infrastructure; no ownership of brand trademarks or patents.<br>
    • <b>Risks:</b> Low inventory risk (often back-to-back ordering or return rights), minimal credit risk.<br>
    • <b>Preferred Method:</b> Resale Price Method (RPM) or TNMM (using Operating Margin OP/Sales as PLI).`;
  } else if (query.includes("dempe") || query.includes("royalty")) {
    return `<b>DEMPE Analysis for Intangibles & Royalties:</b><br><br>
    Legal title alone does not grant royalty entitlement. Tax authorities evaluate:<br>
    1. <b>Development:</b> Who managed the R&D team?<br>
    2. <b>Enhancement:</b> Who upgraded software/features?<br>
    3. <b>Maintenance:</b> Who performed quality assurance?<br>
    4. <b>Protection:</b> Who funded legal trademark/patent protection?<br>
    5. <b>Exploitation:</b> Who took active commercial decisions?<br><br>
    <i>Returns are allocated based on control over DEMPE functions and risk-bearing capacity.</i>`;
  } else {
    return `<b>Transfer Pricing Advisor Answer:</b><br><br>
    Regarding "<i>${escapeHtml(q)}</i>":<br><br>
    In transfer pricing practice, all intercompany transactions must be analyzed under the <b>Arm's Length Principle</b> (OECD Guidelines / Local Tax Code).<br>
    Key steps to address this:<br>
    1. Define the <b>exact nature of transaction</b> (Goods, Services, Intangibles, Financing).<br>
    2. Conduct a <b>FAR Analysis</b> to characterize the entities.<br>
    3. Select the <b>Most Appropriate Method</b> (CUP, TNMM, RPM, CPM, or PSM).<br>
    4. Screen comparable uncontrolled transactions in accepted financial databases to establish the Arm's Length Range.`;
  }
}

function renderCalculator(main) {
  main.innerHTML = `
    <div class="card">
      <h2>🧮 Profit Level Indicator (PLI) & Mark-up Calculator</h2>
      <p style="color: var(--tx-mut);">Test financial margins for TNMM benchmarking and audit preparation.</p>
    </div>

    <div class="grid-2">
      <div class="calc-box">
        <h3>Input Intercompany Financials</h3>
        <br>
        <label style="font-size: 12px; font-weight: 600;">Operating Revenue (Sales/Recharges)</label>
        <input type="number" id="c-rev" value="1150000" oninput="calcPLI()">
        <br><br>
        <label style="font-size: 12px; font-weight: 600;">Operating Expenses (Direct & Indirect Costs)</label>
        <input type="number" id="c-opex" value="1000000" oninput="calcPLI()">
        <br><br>
        <label style="font-size: 12px; font-weight: 600;">Pass-Through / Out-of-Pocket Costs (if any)</label>
        <input type="number" id="c-pass" value="0" oninput="calcPLI()">
      </div>

      <div class="calc-box" style="background: var(--pri-soft);">
        <h3>Calculated Results</h3>
        <br>
        <p><b>Operating Profit (OP):</b> <span id="r-op">₹150,000</span></p>
        <hr style="margin: 10px 0; border: none; border-top: 1px solid var(--bd);">
        <p><b>Mark-up on Cost (OP / OPEX):</b> <b id="r-pli-cost" style="color: var(--pri); font-size: 18px;">15.00%</b></p>
        <p><b>Operating Margin (OP / Revenue):</b> <b id="r-pli-sales" style="color: var(--pri); font-size: 18px;">13.04%</b></p>
        <br>
        <div style="background: var(--card); padding: 10px; border-radius: 6px; font-size: 12px;">
          <b>Job Tip:</b> Pass-through expenses with zero value-add should generally be excluded from the cost base when calculating mark-ups to prevent margin artificial inflation.
        </div>
      </div>
    </div>
  `;
}

function calcPLI() {
  const rev = parseFloat(document.getElementById("c-rev").value) || 0;
  const opex = parseFloat(document.getElementById("c-opex").value) || 0;
  const pass = parseFloat(document.getElementById("c-pass").value) || 0;

  const netOpex = opex - pass;
  const op = rev - opex;

  const pliCost = netOpex > 0 ? ((op / netOpex) * 100).toFixed(2) : "0.00";
  const pliSales = rev > 0 ? ((op / rev) * 100).toFixed(2) : "0.00";

  document.getElementById("r-op").innerText = "₹" + op.toLocaleString();
  document.getElementById("r-pli-cost").innerText = pliCost + "%";
  document.getElementById("r-pli-sales").innerText = pliSales + "%";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

document.getElementById("btn-theme").onclick = () => {

  document.documentElement.setAttribute("data-theme", next);

  localStorage.setItem("tp_theme", next);
};
